<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Portal - Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">
  <div class="scan-line-y"></div>
  <div class="scan-line-x"></div>
  <div class="login-card">
    <div class="login-header">
      <div class="login-icon">♠</div>
      <h1>Card Portal</h1>
      <p>Acesse seu acervo de cartas</p>
    </div>
    <form id="login-form">
      <div class="form-group">
        <label for="username">Usuário</label>
        <input type="text" id="username" name="username" class="input-field" placeholder="ex: admin" required autofocus>
      </div>
      <div class="form-group">
        <label for="password">Senha</label>
        <input type="password" id="password" name="password" class="input-field" placeholder="••••••••" required>
      </div>
      <p id="login-error" class="error-text"></p>
      <button type="submit" class="btn btn-primary btn-full">Entrar</button>
    </form>
  </div>
  <script src="js/auth.js"></script>
</body>
</html>
